name: GPU72 kernel and GL-GLH boot images

# Rebuilds the gpu72 kernel and two temporary-boot GPU payloads from:
#   - the firmware volume committed in uefi/SILICIUM_UEFI.fd (built by the
#     Mu-Silicium "Build and upload picasso FD" workflow, copied here manually)
#   - the XNU kernel + ADT payload built here (macOS, xcodebuild)
#   - BootShim / mkbootimg / DTB / FD config from uefi/mu-silicium (committed here)
#
# Produces 80 MiB payload images for "fastboot boot"; do not flash them.
# iPhone userland is experimental; successful composition is not runtime qualification.
# Pure host regressions run separately in host-checks.yml.

on:
  workflow_dispatch:
    inputs:
      fast:
        description: Skip optional artifact checks for device iteration
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: picasso-bootimg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360
    env:
      PICASSO_EXACT_INPUT_MANIFEST_SHA256: 76d16e3e360af107acc77a9807eacdadcac899ea9c99d88770cb90b275ab7b74
    defaults:
      run:
        shell: bash
        working-directory: device
    steps:
      - name: Check out the picasso device repo
        uses: actions/checkout@v4
        with:
          path: device
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify gpu72 source baseline and saved seed archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code 1c9ebeb17577610ad620bb73941d27844dac0392 -- \
            board.toml unixnu unixnu.lock upstream.rev configs drivers kits package patches scripts uefi policy
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          endpoint = 'repos/tselongson/UniXNU-picasso/actions/artifacts/13604308252'
          metadata = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          assert not metadata['expired'] and metadata['name'] == 'picasso-data-seed-481'
          assert metadata['workflow_run']['id'] == 42448554665
          assert metadata['workflow_run']['head_sha'] == '48597d056d2fcf289c0d6d041a87f127113e410a'
          archive = Path('picasso-seed-481.zip')
          with archive.open('wb') as stream:
              subprocess.run(['gh', 'api', endpoint + '/zip'], stdout=stream, check=True)
          assert archive.stat().st_size == 1180586
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '2042e9d0a6d1d376aeaadfed58bde0872869d12558210d95ad1d4efa838e3fb8'
          # Keep semantic checks; permit this exact saved manifest across recipe-only changes.
          script = Path('scripts/picasso_linux_inputs.py')
          old = "    require(manifest['schema'] == SCHEMA and manifest['recipe_sha256'] == recipe(tree),\n            'iOS16 Compose input recipe differs; refresh Compose on this branch')"
          new = "    require(manifest['schema'] == SCHEMA, 'Invalid iOS16 Compose input schema')\n    exact = os.environ.get('PICASSO_EXACT_INPUT_MANIFEST_SHA256', '')\n    require(manifest['recipe_sha256'] == recipe(tree) or\n            (re.fullmatch('[0-9a-f]{64}', exact) and digest(path) == exact),\n            'Compose recipe differs from the explicitly pinned saved inputs')"
          text = script.read_text()
          assert text.count(old) == 1, 'Saved-seed validation hook changed'
          script.write_text(text.replace(old, new))
          PY

      - name: Check iPhone X inputs and retained kernel backend
        run: |
          python3 scripts/check-picasso-target.py --require-build-inputs \
            --output out/picasso/logs/target-readiness.json --github-env "$GITHUB_ENV"

      - name: Verify firmware volume and DTB are present
        run: |
          test -s uefi/SILICIUM_UEFI.fd || { echo "uefi/SILICIUM_UEFI.fd missing"; exit 1; }
          test -s uefi/mu-silicium/Resources/DTBs/picasso-topology.dtb || { echo "picasso-topology.dtb missing"; exit 1; }
          test -s uefi/mu-silicium/BootShim/BootShim.S || { echo "BootShim.S missing"; exit 1; }
          test -s uefi/mu-silicium/Resources/Scripts/mkbootimg.py || { echo "mkbootimg.py missing"; exit 1; }
          ls -l uefi/SILICIUM_UEFI.fd uefi/mu-silicium/Resources/DTBs/picasso-topology.dtb

      - name: Prepare the isolated upstream source
        run: |
          TREE=$(python3 ./unixnu --prepare)
          echo "UNIXNU_TREE=$TREE" >> "$GITHUB_ENV"

      - name: Restore the kernel compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xnu-ccache
          key: xnu-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: xnu-ccache-${{ runner.os }}-

      - name: Install host tools and check the SDK
        run: |
          # lld is a separate Homebrew formula now; the llvm bottle no longer
          # ships ld.lld, which the entry-probe patcher needs.
          brew install cmake ninja unifdef llvm lld mtools dtc ccache
          # Kernel compiles go through ccache with the SDK's own clang (not the Homebrew llvm
          # added to PATH below); MakeInc.cmd keeps CC/CXX that come from the environment.
          mkdir -p "$RUNNER_TEMP/ccache-bin"
          for tool in clang clang++; do
            # scripts/ci-ccache-clang.py drops XNU's -MJ (ccache refuses it) except for the one record read later.
            printf '#!/bin/sh\nexec python3 -I "%s" "%s" "$@"\n' "$GITHUB_WORKSPACE/device/scripts/ci-ccache-clang.py" "$(xcrun -sdk iphoneos -find "$tool")" > "$RUNNER_TEMP/ccache-bin/$tool"
            chmod +x "$RUNNER_TEMP/ccache-bin/$tool"
          done
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Restore and audit the exact saved 481 seed and signed UI library
        run: |
          python3 ./unixnu defconfig picasso_defconfig
          python3 - <<'PY'
          import hashlib, json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import picasso_linux_inputs as inputs
          tree = Path(os.environ['UNIXNU_TREE'])
          work = Path('out/picasso')
          saved = work / 'persistent-inputs'
          inputs.extract(Path('picasso-seed-481.zip'), saved)
          assert inputs.digest(saved / 'manifest.json') == os.environ['PICASSO_EXACT_INPUT_MANIFEST_SHA256']
          checked = inputs.validate(saved, tree)
          proof = dict(schema=inputs.SCHEMA, repository='tselongson/UniXNU-picasso',
                       recipe_sha256=inputs.recipe(tree), producer_run_id=42448554665,
                       producer_revision='48597d056d2fcf289c0d6d041a87f127113e410a',
                       producer_branch='kd439-pool', producer_workflow='.github/workflows/compose-bootimg.yml',
                       artifact_id=13604308252,
                       artifact_sha256='2042e9d0a6d1d376aeaadfed58bde0872869d12558210d95ad1d4efa838e3fb8',
                       exact_manifest_sha256=inputs.digest(saved / 'manifest.json'))
          (saved / 'reuse.json').write_text(json.dumps(proof, indent=2) + '\n')
          inputs.reuse(tree, saved.resolve(), work.resolve(), 'tselongson/UniXNU-picasso', 'kd439-pool')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('PICASSO_LINUX_INPUTS=' + str(saved.resolve()) + '\n')
          print('Verified original base/Setup seed, signed UI library, OS and UUID:', checked['volume_uuid'])
          PY

      - name: Prepare authenticated stock touch firmware
        run: |
          python3 scripts/fetch-picasso-touch-firmware.py --output out/picasso/novatek/firmware.bin
          echo "NOVATEK_TOUCH_FW=$PWD/out/picasso/novatek/firmware.bin" >> "$GITHUB_ENV"

      - name: Prepare exact stock Adreno 620 firmware
        run: |
          python3 scripts/fetch-picasso-gpu-firmware.py --output out/picasso/gpu-firmware
          echo "ADRENO620_FW_DIR=$PWD/out/picasso/gpu-firmware" >> "$GITHUB_ENV"
          cp out/picasso/gpu-firmware/firmware.json out/picasso/logs/gpu-firmware.json

      - name: Download the target IPSW
        run: |
          mkdir -p out/ipsw
          IPSW="out/ipsw/$PICASSO_IPSW_FILE"
          HOST=updates.cdn-apple.com
          URL="$PICASSO_IPSW_URL"
          if [ ! -s "$IPSW" ]; then
            if ! curl --fail --retry 3 --retry-all-errors --connect-timeout 30 -o "$IPSW" "$URL"; then
              IP=$(curl -s -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$HOST&type=A" \
                    | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(a['data'] for a in d.get('Answer',[]) if a['type']==1))")
              echo "runner DNS failed; pinning $HOST to $IP"
              curl --fail --retry 5 --retry-all-errors --connect-timeout 30 \
                --resolve "$HOST:443:$IP" -o "$IPSW" "$URL"
            fi
          fi
          python3 scripts/check-picasso-target.py --ipsw "$IPSW"
          ls -lh "$IPSW"
          echo "UNIXNU_IPSW=$PWD/$IPSW" >> "$GITHUB_ENV"

      # The original static and System trust caches are extracted from the pinned
      # IPSW here rather than committed; board.toml pins the accepted bundle hash.
      - name: Bundle the original trust caches
        run: |
          mkdir -p out/picasso/logs
          python3 ./unixnu ipsw fetch OS Cryptex1,SystemOS StaticTrustCache Cryptex1,SystemTrustCache 2>&1 | tee out/picasso/logs/actions-ipsw.log
          python3 scripts/prepare-original-trust.py --tree "$UNIXNU_TREE" --inputs "out/ipsw/$PICASSO_IPSW_BUILD" --output out/picasso/original-static-system.bundle 2>&1 | tee out/picasso/logs/actions-trust.log
          python3 scripts/prepare-picasso-ui-trust.py --original out/picasso/original-static-system.bundle \
            --library out/picasso/libpicasso-sb.dylib --output out/picasso/ui-trust.bundle \
            2>&1 | tee out/picasso/logs/actions-ui-trust.log
          cp out/picasso/ui-trust.json out/picasso/logs/ui-trust.json

      - name: Verify native macOS root disks against the signed policy
        if: ${{ !inputs.fast }}
        run: |
          sudo "$(command -v python3)" scripts/check-picasso-root-inputs.py \
            --inputs "out/ipsw/$PICASSO_IPSW_BUILD" \
            --output out/picasso/logs/root-inputs.json

      - name: Prepare the retained Darwin 23 native kext donor
        run: |
          python3 scripts/prepare-picasso-kernelcache.py --tree "$UNIXNU_TREE" \
            --output "out/ipsw/$PICASSO_BACKEND_BUILD" 2>&1 | tee out/picasso/logs/actions-kernel-donor.log
          cp "out/ipsw/$PICASSO_BACKEND_BUILD/report.json" out/picasso/logs/kernel-donor.json
          echo "UNIXNU_KERNELCACHE=$PWD/out/ipsw/$PICASSO_BACKEND_BUILD/kernelcache.decompressed" >> "$GITHUB_ENV"

      - name: Build kernel + payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNIXNU_UNIQUE_CHIP_ID: "41a551c0dec0de01"
          CC: ${{ runner.temp }}/ccache-bin/clang
          CXX: ${{ runner.temp }}/ccache-bin/clang++
          CCACHE_DIR: ${{ runner.temp }}/xnu-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 3G
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines,file_stat_matches
          CCACHE_LOGFILE: ${{ runner.temp }}/ccache.log
        run: |
          python3 ./unixnu fetch xnu libplatform libdispatch AvailabilityVersions libpthread corecrypto-2023 IOStorageFamily
          mkdir -p out/picasso/logs
          python3 ./unixnu build kernel payload -j 3 --skip-setup --trust-cache out/picasso/ui-trust.bundle --data-ramdisk out/picasso/ram-data/data.dbrdisk 2>&1 | tee out/picasso/logs/actions-build.log
          ccache -sv || true
          # Which options and inputs ccache refuses (the stats only count them).
          grep -hE "unsupported|Multiple input|multiple source" "$RUNNER_TEMP/ccache.log" 2>/dev/null | sed -E 's/^\[[^]]*\] //' | sort | uniq -c | sort -rn | head -20 || true

      - name: Verify Data seed, compiled UUID and payload handoff
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-data-artifacts.py --tree out/picasso/tree --work out/picasso \
            --output out/picasso/logs/data-artifacts.json

      - name: Check runtime memory and swap boundaries
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-runtime-memory.py --xnu out/picasso/tree/.cache/xnu-work --output out/picasso/host-checks/runtime-memory
          cp out/picasso/host-checks/runtime-memory/results.json out/picasso/logs/runtime-memory-host.json

      - name: Check display policy against the payload ADT
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-display-policy.py \
            --adt out/picasso/logs/data-artifacts.files/EFI/UniXNU/Payloads/kernel.macho.adt \
            --output out/picasso/host-checks/display-policy-payload
          cp out/picasso/host-checks/display-policy-payload/results.json out/picasso/logs/display-policy-payload.json

      - name: Check iOS 16 registered-port contracts
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-mach-ports.py --xnu out/picasso/tree/.cache/xnu-work \
            --output out/picasso/host-checks/mach-ports
          cp out/picasso/host-checks/mach-ports/results.json out/picasso/logs/mach-ports-host-check.json

      - name: Check bounded framebuffer method diagnostics
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-fb-method-trace.py --xnu out/picasso/tree/.cache/xnu-work \
            --output out/picasso/host-checks/fb-method-trace
          cp out/picasso/host-checks/fb-method-trace/results.json out/picasso/logs/fb-method-trace.json

      - name: Check iOS 16 framebuffer and IOSurface adapters
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-ios16-surface-abi.py --xnu out/picasso/tree/.cache/xnu-work \
            --output out/picasso/host-checks/ios16-surface-abi
          cp out/picasso/host-checks/ios16-surface-abi/results.json out/picasso/logs/ios16-surface-abi.json

      - name: Check native counter microtime conversion
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-microtime.py --xnu out/picasso/tree/.cache/xnu-work \
            --output out/picasso/host-checks/microtime
          cp out/picasso/host-checks/microtime/results.json out/picasso/logs/microtime-host-check.json

      - name: Verify software AES provider against the original class ABI
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-aes-artifacts.py --tree out/picasso/tree --work out/picasso \
            --kernelcache "$UNIXNU_KERNELCACHE" --output out/picasso/logs/aes-artifacts.json

      - name: Verify watchdog service policy against the linked native driver
        if: ${{ !inputs.fast }}
        run: |
          python3 scripts/check-picasso-watchdog-policy.py --verify \
            --kernelcache "$UNIXNU_KERNELCACHE" --candidate out/picasso/kernel/kernel.macho \
            --native-prelink-dir "$UNIXNU_TREE/kits/XnuPrelink" \
            --output out/picasso/logs/watchdog-policy.json

      - name: Verify CPU GOP display against the original class ABI
        if: ${{ !inputs.fast }}
        run: |
          # The gpu72 builder added PicassoSpmi.cpp, but its verifier still
          # lists the older archive. Keep the exact member and ABI checks.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-picasso-display-artifacts.py')
          text = path.read_text()
          old = "'PicassoBrightness.late.o'}, 'Wrong display/state/input archive members')"
          new = "'PicassoBrightness.late.o', 'PicassoSpmi.o'}, 'Wrong display/state/input archive members')"
          assert text.count(old) == 1, 'Display verifier member list changed'
          path.write_text(text.replace(old, new))
          PY
          python3 scripts/check-picasso-display-artifacts.py --tree out/picasso/tree --work out/picasso \
            --kernelcache "$UNIXNU_KERNELCACHE" --output out/picasso/logs/display-artifacts.json

      - name: Verify original Sandbox and IOSurface in the prelinked kernel
        if: ${{ !inputs.fast }}
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          kernel = Path('out/picasso/kernel/kernel.macho')
          plan = json.loads(kernel.with_suffix('.json').read_text())
          if hashlib.sha256(kernel.read_bytes()).hexdigest() != plan['candidate_sha256']:
              raise SystemExit('Prelink report does not match kernel.macho')
          for component in ('com.apple.security.sandbox', 'com.apple.kext.AppleMatch', 'com.apple.iokit.IOSurface', 'com.apple.iokit.IOGPUFamily'):
              if component not in plan['components']:
                  raise SystemExit(f'Missing required original component: {component}')
              start = plan['module_entrypoints'][component]['start_va']
              if not any(e['module'] == component and e['segment'] == '__TEXT_EXEC'
                         and e['va'] <= start < e['va'] + e['size'] for e in plan['extents']):
                  raise SystemExit(f'Missing executable module entry: {component}')
              print(f'Prelink includes {component}, start={start:#x}')
          PY

      - name: Download both matching GPU addon and trust pairs
        run: |
          mkdir -p inputs/gpu72
          BASE=https://github.com/silenzio111/UniXNU-picasso/releases/download
          curl -fL --retry 3 "$BASE/picasso-gpu-addon-gpu72/ngpu-addon-ios16-gl-gpu72.bin" -o inputs/gpu72/ngpu-addon-ios16-gl-gpu72.bin
          curl -fL --retry 3 "$BASE/picasso-gpu-addon-gpu72/gpu-trust.bundle" -o inputs/gpu72/gpu-trust.bundle
          curl -fL --retry 3 "$BASE/picasso-gpu-addon-gpu72-glh/ngpu-addon-ios16-gl-gpu72-glh.bin" -o inputs/gpu72/ngpu-addon-ios16-gl-gpu72-glh.bin
          curl -fL --retry 3 "$BASE/picasso-gpu-addon-gpu72-glh/gpu-trust-glh.bundle" -o inputs/gpu72/gpu-trust-glh.bundle
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          pins = {
              'ngpu-addon-ios16-gl-gpu72.bin': '75618b93ca16420f71777f7ee6e733cfedee5cdf23ee3e26a6cc8221f4cead0b',
              'gpu-trust.bundle': '27ea321d7506f6a6f82751b61a7791848ddee938b22357e33f48e136a2ecbc0b',
              'ngpu-addon-ios16-gl-gpu72-glh.bin': '84c9db3c844f5557cd2c1de4165bb2d98fa176befafb97000b3daa278d73770f',
              'gpu-trust-glh.bundle': 'b277d68c3951d46ad61fe3137bccbd3f1f8baf14a50a751bafdc70c15e92ed9f',
          }
          for name, expected in pins.items():
              data = (Path('inputs/gpu72') / name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == expected, name
              if name.endswith('.bin'):
                  assert data[:8] == b'NGPUADD2', name
              print(name, expected)
          PY

      - name: Build full gpu72 GL and GLH boot payloads with the saved Setup seed
        env:
          DATA_RAMDISK: ${{ github.workspace }}/device/out/picasso/persistent-inputs/setup.dbr
          UNIQUE_CHIP_ID: 41a551c0dec0de01
          GRID: '0'
          WF_DROP_LOGO_HOLD: '1'
        run: |
          OWNER_TRUST="$PWD/inputs/gpu72/gpu-trust.bundle" \
            python3 scripts/build-wf-payload.py gpu72-gl inputs/gpu72/ngpu-addon-ios16-gl-gpu72.bin \
              sheng-dpu-scanout=2 sheng-gpu-perf-index=4 sheng-gpu-gl=1 glwait=0 glhooks=1 wifi=0
          OWNER_TRUST="$PWD/inputs/gpu72/gpu-trust-glh.bundle" \
            python3 scripts/build-wf-payload.py gpu72-glh inputs/gpu72/ngpu-addon-ios16-gl-gpu72-glh.bin \
              sheng-dpu-scanout=2 sheng-gpu-perf-index=4 sheng-gpu-gl=1 glwait=0 glhooks=1 wifi=0 glh=1
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          kernel = Path('out/picasso/kernel/kernel.macho')
          kernel_hash = hashlib.sha256(kernel.read_bytes()).hexdigest()
          for tag in ('gpu72-gl', 'gpu72-glh'):
              report = json.loads((Path('out') / tag / 'picasso/payload/payload.json').read_text())
              assert report['kernel_sha256'] == kernel_hash
              assert report['data_ramdisk_sha256'] == '4998d22158c808c90b53b7c1f8a30d021401017b2947b5df034ded70bd74cfba'
              assert len(report['kernel_args'].encode()) <= 1000
              assert ('glh=1' in report['kernel_args'].split()) == (tag == 'gpu72-glh')
              print(tag, 'kernel=', kernel_hash, 'args=', len(report['kernel_args'].encode()))
          provenance = dict(source_baseline='1c9ebeb17577610ad620bb73941d27844dac0392',
                            build_commit=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
                            kernel_sha256=kernel_hash, hardware_tested=False,
                            note='Rebuilt from gpu72 source; SDK/compiler differences may change the binary hash. Temporary fastboot boot images only.')
          Path('out/picasso/kernel/gpu72-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('GPU72 source baseline: `1c9ebeb`\n\nKernel SHA256: `' + kernel_hash + '`\n\nImages: gpu72-gl and gpu72-glh. Original #481 Data seed retained. Hardware test pending.\n')
          PY
          shasum -a 256 out/picasso/kernel/kernel.macho > out/picasso/kernel/SHA256SUMS
          shasum -a 256 out/gpu72-gl/picasso/boot/*.img out/gpu72-glh/picasso/boot/*.img > out/picasso/kernel/BOOT-SHA256SUMS

      # A few MiB of packed seeds must outlive the disposable kernel artifacts.
      # If all copies become unavailable, reuse fails instead of formatting APFS.
      - name: Retain the exact Data seed independently
        uses: actions/upload-artifact@v4
        with:
          name: picasso-data-seed-481-${{ github.run_number }}
          path: device/out/picasso/persistent-inputs/**
          if-no-files-found: error
          retention-days: 90

      - name: Upload boot image, diagnostic kernel, reports and reusable inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picasso-gpu72-${{ github.run_number }}
          include-hidden-files: true
          # Keep the diagnostic kernel and exact reusable seeds. Raw audit Data
          # copies (.cdr), extracted payload trees and object files stay on runner.
          path: |
            device/out/gpu72-gl/picasso/boot/**
            device/out/gpu72-gl/picasso/payload/*.json
            device/out/gpu72-glh/picasso/boot/**
            device/out/gpu72-glh/picasso/payload/*.json
            device/out/picasso/kernel/kernel.macho
            device/out/picasso/kernel/*.json
            device/out/picasso/kernel/*SHA256SUMS
            device/out/picasso/payload/*.json
            device/out/picasso/logs/**/*.log
            device/out/picasso/logs/**/*.json
            device/out/picasso/logs/**/*.txt
            device/out/picasso/host-checks/**/*.json
            device/out/picasso/host-checks/**/*.log
            device/out/picasso/tree/build/**/*.json
            device/out/picasso/tree/build/**/*.log
            device/out/picasso/novatek/*.json
            device/out/picasso/ram-data/*.json
            device/out/picasso/persistent-inputs/**
            device/out/picasso/.config
            !device/out/picasso/logs/**/*.files/**
            !device/out/picasso/logs/**/*.cdr
          if-no-files-found: warn
          retention-days: 7
